# ~/.tmux.inner.conf

# 1. Unbind defaults to avoid accidents
unbind C-b

# 2. Set Dedicated Prefix: Ctrl + Space
set -g prefix C-Space
bind C-Space send-prefix

# 3. Horizontal Navigation (Tabs)
# Ctrl+Space then h = Previous Terminal
bind h previous-window

# Ctrl+Space then l = Next Terminal
bind l next-window

# 4. Management
# Ctrl+Space then c = New Terminal
bind c new-window

# 5. Visuals (Status bar on top of the bottom pane)
set -g status-position bottom 
set -g status-justify left
set -g status-left ""
set -g status-right ""
set -g status-style "bg=default fg=green"

# Set mouse on
set -g mouse on

set-window-option -g mode-keys vi
